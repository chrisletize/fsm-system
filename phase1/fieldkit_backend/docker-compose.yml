# REFERENCE COPY -- not the file Docker runs.
# The live file is ~/docker/fieldkit-prod/docker-compose.yml on ubuntu-business,
# one level ABOVE this git checkout, so it isn't under version control. This copy
# mirrors it so the repo records the real production config; if you change the
# live file, update this one in the same sitting. Last synced 2026-10-27.
# See docs/DEPLOYMENT/fieldkit-prod-server.md for the other server-only files.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldkit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldkit"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:5001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: fieldkit
      DB_PASSWORD: ${DB_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      UPLOAD_DIR: /data/uploads
      MAP_DIR: /data/maps
    volumes:
      - ./fsm-system/phase1/fieldkit_backend:/app
      # Uploaded documents (signed occupied-release PDFs). Deliberately
      # OUTSIDE the git checkout at ./fsm-system so customer documents never
      # land in the repo working tree, and a host folder rather than a named
      # volume so they stay browsable/backup-able with ordinary file tools.
      - ./uploads:/data/uploads
      # Self-hosted basemap for the sales map (tiles, fonts, icons), built by
      # fsm-system/ops/maps/refresh-basemap.sh. Read-only; regenerable, so not
      # backed up.
      - ./maps:/data/maps:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
